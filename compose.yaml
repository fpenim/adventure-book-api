services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: adventure_book
      POSTGRES_USER: adventure
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adventure -d adventure_book"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
